services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq-server
    ports:
      - "5672:5672"   # Uygulama bağlantısı
      - "15672:15672" # Arayüz
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # İleride bu servisleri de Dockerize edip buraya ekleyebiliriz.